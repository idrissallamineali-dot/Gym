<style>

.stage-footer {

<div class="app-sidebar">

    </div>
    <div class="progress-label">

    </div>
  </div>
  <div class="stages-list" id="stagesNavList"></div>
</div>

<div class="app-main">
  <div class="content-wrapper" id="stageContentWrapper"></div>
</div>

<script>
// Masterclass Curriculum with Integrated Hard Practice Set
const curriculum = [
  // ================= LEVEL 1: FOUNDATIONS =================
  {
    stage: 1, levelNum: 1, levelName: "Foundations",
    title: "What a Promise Actually Is",
    conceptDirect: "A Promise is an object that represents a value you don't have yet, but will get eventually — or an error explaining why you won't.",
    lesson: `
      <h2>1. The Mental Model: The Claim Ticket</h2>
      <p>When you drop off your coat at a dry cleaner, the clerk gives you a claim ticket. In JavaScript, a <code>Promise</code> is that exact ticket. It is an instantiated object in memory with internal slots:</p>
      <ul>
        <li><code>[[PromiseState]]</code>: Starts at <code>"pending"</code>.</li>
        <li><code>[[PromiseResult]]</code>: Starts at <code>undefined</code>.</li>
        <li><code>[[PromiseFulfillReactions]]</code> / <code>[[PromiseRejectReactions]]</code>: Callbacks waiting to fire.</li>
      </ul>
    `,
    code: `const p = new Promise((resolve, reject) => {
  // asynchronous work
});
console.log(p); // Promise {<pending>}`,
    runnable: () => "Promise { <pending> }",
    hardExercise: {
      id: "Part 1 — Q1",
      title: "Pending vs Settled vs Handled",
      prompt: "What is the exact difference between a promise being **pending**, being **settled**, and being **handled**? Give an example where a promise is settled but not yet handled.",
      solution: `• <strong>Pending:</strong> The background task is still running; no result or error exists yet.<br>
• <strong>Settled:</strong> The promise has transitioned to either 'fulfilled' or 'rejected'. From this moment on, its state and value are immutable.<br>
• <strong>Handled:</strong> At least one reaction callback (.then or .catch) has been attached to it.<br><br>
<strong>Example of Settled but Unhandled:</strong><br>
<code>const p = Promise.reject(new Error("Database down"));</code><br>
<code>setTimeout(() => p.catch(err => {}), 100);</code><br>
Here, <code>p</code> is settled (rejected) immediately at t=0, but remains unhandled for 100ms until the timeout executes, which can trigger an UnhandledPromiseRejection warning in the runtime.`
    },
    quiz: {
      q: "True or false — a Promise contains its value immediately when created.",
      options: [
        "True. It computes its value on creation.",
        "False. It starts pending; the value only exists once it settles."
      ],
      correct: 1,
      hint: "Remember the claim ticket analogy: you don't have the clean coat in your hand the moment the ticket is printed."
    }
  },

  {
    stage: 2, levelNum: 1, levelName: "Foundations",
    title: "The Three States & Settling Permanence",
    conceptDirect: "A Promise is always pending, fulfilled, or rejected — and once it leaves pending, that state is locked forever ('settled').",
    lesson: `
      <h2>1. The One-Way State Lock</h2>
      <p>A Promise transitions from <code>pending</code> to either <code>fulfilled</code> or <code>rejected</code> exactly once. Any subsequent call to resolve or reject is discarded by the engine's internal one-shot guard.</p>
    `,
    code: `const p1 = new Promise((res) => res(1));        // fulfilled
const p2 = new Promise((res, rej) => rej('x'));  // rejected
const p3 = new Promise(() => {});                // stays pending forever`,
    runnable: () => "p1: fulfilled\np2: rejected\np3: pending forever",
    hardExercise: {
      id: "Part 1 — Q2",
      title: "The Thenable Settlement Guard",
      prompt: "<code>resolve(x)</code> is called where <code>x</code> is a thenable whose <code>.then()</code> never calls either callback. What state is the outer promise in, forever? Now change <code>x</code> to a thenable that calls <code>resolve</code> twice with different values ('a' then 'b') — which value wins, and why?",
      solution: `1. The outer promise stays <strong>pending forever</strong> because the JavaScript engine's Promise Resolution Procedure waits indefinitely for the thenable's .then() callback to invoke resolve/reject.<br><br>
2. If it calls <code>resolve('a')</code> and then <code>resolve('b')</code>, <strong>'a' wins</strong>. The internal one-shot guard flips to settled on the very first invocation, making all subsequent calls no-ops.`
    },
    quiz: {
      q: "Can a fulfilled promise later become rejected?",
      options: [
        "Yes, if reject() is called in a timeout.",
        "No — once settled, the state is frozen forever, in either direction."
      ],
      correct: 1,
      hint: "Settling is permanent. Once the internal state changes from pending, it can never change again."
    }
  },

  {
    stage: 3, levelNum: 1, levelName: "Foundations",
    title: "Creating a Promise: resolve/reject",
    conceptDirect: "new Promise((resolve, reject) => {...}) — call resolve(value) on success, reject(error) on failure, inside that function.",
    lesson: `
      <h2>1. The Executor Signature</h2>
      <p>The executor function receives <code>(resolve, reject)</code>. Always reject with a real <code>new Error(...)</code> to preserve the stack trace for production debugging.</p>
    `,
    code: `function checkAge(age) {
  return new Promise((resolve, reject) => {
    if (age >= 18) resolve('allowed');
    else reject(new Error('too young'));
  });
}`,
    runnable: () => "checkAge(20) -> resolved 'allowed'\ncheckAge(15) -> rejected Error('too young')",
    hardExercise: {
      id: "Part 1 — Q4",
      title: "Chaining Cycles",
      prompt: "What is a 'chaining cycle' and what does JavaScript do when it detects one?",
      solution: `A <strong>chaining cycle</strong> occurs when a Promise attempts to resolve itself directly or through a circular chain of promises (e.g. <code>const p = Promise.resolve().then(() => p);</code>).<br><br>
When the engine's Promise Resolution Procedure detects that a promise is resolving to itself, it rejects immediately with a <code>TypeError: Chaining cycle detected for promise</code> to prevent an infinite asynchronous loop.`
    },
    quiz: {
      q: "What happens if you call resolve() and then reject() in the same executor?",
      options: [
        "The reject overrides the resolve.",
        "Nothing on the second call — the promise already settled on the first one, so later calls are silently ignored."
      ],
      correct: 1,
      hint: "The first call settles the state immediately."
    }
  },

  {
    stage: 4, levelNum: 1, levelName: "Foundations",
    title: "The Executor Runs Synchronously",
    conceptDirect: "The function passed to new Promise() runs immediately, the instant the Promise is constructed — not later.",
    lesson: `
      <h2>1. Immediate Construction Execution</h2>
      <p>The executor callback is invoked synchronously on the Call Stack during the evaluation of <code>new Promise()</code> before the constructor returns.</p>
    `,
    code: `console.log('1');
new Promise((resolve) => {
  console.log('2'); // runs immediately
  resolve();
});
console.log('3');`,
    runnable: () => "1\n2\n3",
    hardExercise: {
      id: "Part 1 — Q5",
      title: "Microtask Queue Interleaving Prediction",
      prompt: `Predict the output, then explain it line by line:
<pre><code>console.log("1");
setTimeout(() => console.log("2"), 0);
Promise.resolve().then(() => {
  console.log("3");
  Promise.resolve().then(() => console.log("4"));
});
Promise.resolve().then(() => console.log("5"));
console.log("6");</code></pre>`,
      solution: `<strong>Output:</strong> <code>1, 6, 3, 5, 4, 2</code><br><br>
<strong>Step-by-step breakdown:</strong><br>
1. <code>1</code> logs synchronously.<br>
2. <code>setTimeout(..., 0)</code> schedules <code>2</code> into the Macrotask Queue.<br>
3. First <code>Promise.resolve().then()</code> schedules microtask #1 (Task 3).<br>
4. Second <code>Promise.resolve().then()</code> schedules microtask #2 (Task 5).<br>
5. <code>6</code> logs synchronously. Call stack is now clear.<br>
6. Microtask Queue opens: Microtask #1 runs -> logs <code>3</code>, and schedules microtask #3 (Task 4) at the end of the microtask queue.<br>
7. Microtask #2 runs -> logs <code>5</code>.<br>
8. Microtask #3 runs -> logs <code>4</code>. Microtask queue is now empty.<br>
9. Event loop proceeds to Macrotask Queue: logs <code>2</code>.`
    },
    quiz: {
      q: "Does '2' print before or after '3'?",
      options: [
        "After '3' because promises are asynchronous.",
        "Before — the executor body is ordinary synchronous code, so it runs the moment the Promise is created."
      ],
      correct: 1,
      hint: "The executor runs right away on the spot."
    }
  },

  // ================= LEVEL 2: CONSUMING A PROMISE =================
  {
    stage: 5, levelNum: 2, levelName: "Consuming a Promise",
    title: ".then() Reads the Resolved Value",
    conceptDirect: ".then(fn) registers a function that receives whatever value was passed to resolve().",
    lesson: `
      <h2>1. Subscribing to Fulfillment</h2>
      <p><code>.then(onFulfilled)</code> registers a callback into the microtask reaction queue to be invoked with the resolved data once the promise enters fulfilled state.</p>
    `,
    code: `const p = Promise.resolve('pizza');
p.then((food) => console.log(food)); // 'pizza'`,
    runnable: () => "pizza",
    hardExercise: {
      id: "Part 1 — Q11",
      title: "Async Return Microtask Cost",
      prompt: "Explain, precisely, why <code>async function f() { return 5; }</code> still requires a microtask tick before <code>f().then(cb)</code> runs <code>cb</code>, even though the function's return value was never actually asynchronous.",
      solution: `Because by ECMAScript specification, calling <code>.then(cb)</code> on any Promise (even one already fulfilled with a synchronous value like <code>5</code>) <strong>always queues a Microtask</strong> rather than executing <code>cb</code> synchronously. This ensures runtime consistency and prevents race conditions ("Zalgo").`
    },
    quiz: {
      q: "What does the callback inside .then() receive?",
      options: [
        "The Promise object itself.",
        "Whatever value was passed into resolve()."
      ],
      correct: 1,
      hint: "The payload passed to resolve() is forwarded directly to .then()."
    }
  },

  {
    stage: 6, levelNum: 2, levelName: "Consuming a Promise",
    title: ".catch() Reads the Rejection",
    conceptDirect: ".catch(fn) registers a function that receives whatever was passed to reject().",
    lesson: `
      <h2>1. Error Handling Semantics</h2>
      <p>Under the hood, <code>promise.catch(fn)</code> is syntactic sugar for <code>promise.then(null, fn)</code>.</p>
    `,

// App State
let currentStageIdx = 0;
let unlockedStageIdx = 0;

try {
  const saved = localStorage.getItem('promises_hard_progress');
  if (saved !== null) unlockedStageIdx = parseInt(saved, 10);
} catch(e) {}

function renderSidebar() {
  const navList = document.getElementById('stagesNavList');
  navList.innerHTML = '';
  let currLevel = -1;

  curriculum.forEach((st, idx) => {
    if (st.levelNum !== currLevel) {
      currLevel = st.levelNum;
      const groupHeader = document.createElement('div');
      groupHeader.className = 'level-group-title';
      groupHeader.textContent = `Level ${st.levelNum} · ${st.levelName}`;
      navList.appendChild(groupHeader);
    }

    const isUnlocked = idx <= unlockedStageIdx;
    const isCurrent = idx === currentStageIdx;
    const isCompleted = idx < unlockedStageIdx;

    const item = document.createElement('a');
    item.className = `stage-nav-item ${isCurrent ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
    
    let icon = isCompleted ? '✅' : (isCurrent ? '📍' : (isUnlocked ? '🔓' : '🔒'));
    item.innerHTML = `
      <div style="display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
        <span style="margin-right:8px;">${icon}</span>
        <span>${st.stage}. ${st.title}</span>
      </div>
    `;

    if (isUnlocked) {
      item.onclick = (e) => {
        e.preventDefault();
        loadStage(idx);
      };
    }
    navList.appendChild(item);
  });

  const progressPercent = Math.round(((unlockedStageIdx + 1) / curriculum.length) * 100);
  document.getElementById('overallProgressBar').style.width = `${progressPercent}%`;
  document.getElementById('overallProgressText').textContent = `${unlockedStageIdx + 1} / ${curriculum.length} (${progressPercent}%)`;
}

function loadStage(idx) {
  currentStageIdx = idx;
  const stage = curriculum[idx];
  const wrapper = document.getElementById('stageContentWrapper');

  wrapper.innerHTML = `
    <div class="stage-meta">
      <span class="level-badge">Level ${stage.levelNum} — ${stage.levelName}</span>
      <span class="stage-counter">Stage ${stage.stage} of ${curriculum.length}</span>
    </div>
    <h1 class="stage-title">${stage.title}</h1>

    <div class="callout callout-blue">
      <strong>🎯 Direct Concept:</strong>
      <p style="color:#f8fafc;font-size:15.5px;font-weight:600;margin:0;">${stage.conceptDirect}</p>
    </div>

    ${stage.lesson}

    <h2>💻 Centerpiece Code Example</h2>
    <div class="code-runner">
      <div class="code-header">
        <span>javascript</span>
        <button class="btn-run" onclick="runStageCode()">▶ Run in Console</button>
      </div>
      <pre><code>${stage.code}</code></pre>
      <div class="console-output" id="consoleBox">Console output will appear here after clicking "Run".</div>
    </div>

    <!-- Hard Practice Exercise Integration -->
    ${stage.hardExercise ? `
      <div class="hard-exercise-card">
        <div class="hard-badge">🔥 ${stage.hardExercise.id} · Hard Practice Problem</div>
        <div class="hard-title">${stage.hardExercise.title}</div>
        <div style="font-size:14.5px;color:#cbd5e1;line-height:1.65;margin-bottom:12px;">${stage.hardExercise.prompt}</div>
        <button class="toggle-solution-btn" onclick="toggleSolution('sol-${stage.stage}')">👁️ Reveal Detailed Answer &amp; Analysis</button>
        <div class="solution-box" id="sol-${stage.stage}">
          ${stage.hardExercise.solution}
        </div>
      </div>
    ` : ''}

    <div class="quiz-gate-card">
      <div class="quiz-gate-header">
        <span>🛡️ Stage Gatekeeper Quiz</span>
      </div>
      <div class="quiz-question">${stage.quiz.q}</div>
      <div class="quiz-options" id="quizOptionsContainer"></div>
      <div class="feedback-box" id="quizFeedbackBox"></div>
    </div>

    <div class="stage-footer">
      <button class="btn-nav" id="btnPrev" onclick="navigate(-1)">← Previous Stage</button>
      <button class="btn-nav btn-nav-primary locked-btn" id="btnNext" onclick="navigate(1)">Next Stage →</button>
    </div>
  `;

  const container = document.getElementById('quizOptionsContainer');
  const isAlreadyPassed = idx < unlockedStageIdx;

  stage.quiz.options.forEach((opt, optIdx) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option-btn';
    btn.textContent = opt;

    if (isAlreadyPassed && optIdx === stage.quiz.correct) {
      btn.className += ' correct disabled';
    }

    btn.onclick = () => handleQuizAttempt(optIdx, stage.quiz.correct, stage.quiz.hint, btn);
    container.appendChild(btn);
  });

  document.getElementById('btnPrev').disabled = (idx === 0);
  const nextBtn = document.getElementById('btnNext');
  if (isAlreadyPassed || (idx === curriculum.length - 1 && unlockedStageIdx === curriculum.length - 1)) {
    nextBtn.className = 'btn-nav btn-nav-primary';
    nextBtn.disabled = (idx === curriculum.length - 1);
    nextBtn.textContent = idx === curriculum.length - 1 ? '🎉 Track Completed!' : 'Next Stage →';
  } else {
    nextBtn.className = 'btn-nav btn-nav-primary locked-btn';
    nextBtn.disabled = true;
    nextBtn.textContent = 'Next Stage → (Locked 🔒)';
  }

  renderSidebar();
  document.querySelector('.app-main').scrollTop = 0;
}

function toggleSolution(id) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function handleQuizAttempt(selected, correct, hint, btn) {
  const feedback = document.getElementById('quizFeedbackBox');
  feedback.style.display = 'block';

  if (selected === correct) {
    document.querySelectorAll('.quiz-option-btn').forEach(b => b.classList.add('disabled'));
    btn.className = 'quiz-option-btn correct disabled';
    feedback.className = 'feedback-box success';
    feedback.innerHTML = `<strong>✅ Excellent!</strong> Concept mastered. You have unlocked the next stage.`;

    if (currentStageIdx === unlockedStageIdx && unlockedStageIdx < curriculum.length - 1) {
      unlockedStageIdx++;
      try {
        localStorage.setItem('promises_hard_progress', unlockedStageIdx.toString());
      } catch(e) {}
    }

    const nextBtn = document.getElementById('btnNext');
    nextBtn.className = 'btn-nav btn-nav-primary';
    nextBtn.disabled = (currentStageIdx === curriculum.length - 1);
    nextBtn.textContent = currentStageIdx === curriculum.length - 1 ? '🎉 Track Completed!' : 'Next Stage →';

    renderSidebar();
  } else {
    btn.className = 'quiz-option-btn wrong';
    feedback.className = 'feedback-box hint';
    feedback.innerHTML = `<strong>💡 Coach Insight (Try again):</strong> ${hint}`;
  }
}

function runStageCode() {
  const box = document.getElementById('consoleBox');
  box.textContent = "Executing on Call Stack...";
  setTimeout(() => {
    box.textContent = curriculum[currentStageIdx].runnable();
  }, 150);
}

function navigate(dir) {
  const target = currentStageIdx + dir;
  if (target >= 0 && target <= unlockedStageIdx && target < curriculum.length) {
    loadStage(target);
  }
}

loadStage(unlockedStageIdx);
</script>
</body>
</html>
