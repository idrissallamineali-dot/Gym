<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown & Icon Examples</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-10 font-sans">

    <h1 class="text-3xl font-bold mb-10 text-center">Tailwind Dropdown & Icon Examples</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

        <!-- Example 1: The Classic Navbar Dropdown -->
        <div class="bg-white p-8 rounded-xl shadow-md text-center">
            <h2 class="text-xl font-bold mb-6 text-blue-600">1. Navbar Link Dropdown</h2>
            
            <div class="relative group inline-block">
                <!-- Trigger Button -->
                <button class="flex items-center space-x-2 text-gray-700 font-semibold hover:text-blue-500 py-2">
                    <span>Products</span>
                    <!-- Small arrow icon -->
                    <i class="fa-solid fa-chevron-down text-sm transition-transform group-hover:rotate-180"></i>
                </button>

                <!-- Dropdown Menu -->
                <div class="absolute left-0 mt-1 w-48 bg-white border border-gray-200 rounded-lg shadow-xl hidden group-hover:block z-10 text-left overflow-hidden">
                    <a href="#" class="block px-4 py-3 hover:bg-blue-50 hover:text-blue-600 border-b">Software</a>
                    <a href="#" class="block px-4 py-3 hover:bg-blue-50 hover:text-blue-600 border-b">Hardware</a>
                    <a href="#" class="block px-4 py-3 hover:bg-blue-50 hover:text-blue-600">Subscriptions</a>
                </div>
            </div>
            
            <p class="text-sm text-gray-400 mt-10">Hover over "Products"</p>
        </div>


        <!-- Example 2: The User Profile Menu -->
        <div class="bg-white p-8 rounded-xl shadow-md text-center">
            <h2 class="text-xl font-bold mb-6 text-purple-600">2. Icon Profile Dropdown</h2>
            
            <div class="relative group inline-block">
                <!-- Trigger Button (Icon only) -->
                <button class="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center hover:bg-purple-200 transition">
                    <i class="fa-solid fa-user text-xl"></i>
                </button>

                <!-- Dropdown Menu -->
                <div class="absolute right-0 mt-2 w-56 bg-white border border-gray-200 rounded-lg shadow-xl hidden group-hover:block z-10 text-left overflow-hidden">
                    <!-- Menu Header -->
                    <div class="px-4 py-3 bg-gray-50 border-b">
                        <p class="text-sm text-gray-500">Signed in as</p>
                        <p class="font-bold text-gray-800">student@exam.com</p>
                    </div>
                    <!-- Menu Links with Icons -->
                    <a href="#" class="block px-4 py-2 hover:bg-gray-100 text-gray-700">
                        <i class="fa-solid fa-gear w-6"></i> Settings
                    </a>
                    <a href="#" class="block px-4 py-2 hover:bg-gray-100 text-red-600 border-t">
                        <i class="fa-solid fa-arrow-right-from-bracket w-6"></i> Logout
                    </a>
                </div>
            </div>

            <p class="text-sm text-gray-400 mt-10">Hover over the User Icon</p>
        </div>


        <!-- Example 3: The "More Options" Three Dots Menu -->
        <div class="bg-white p-8 rounded-xl shadow-md text-center">
            <h2 class="text-xl font-bold mb-6 text-green-600">3. "Three Dots" Card Menu</h2>
            
            <div class="relative group inline-block">
                <!-- Trigger Button -->
                <button class="text-gray-400 hover:text-gray-600 p-2">
                    <i class="fa-solid fa-ellipsis-vertical text-2xl"></i>
                </button>

                <!-- Dropdown Menu -->
                <div class="absolute left-1/2 -translate-x-1/2 mt-2 w-32 bg-white border border-gray-200 rounded-lg shadow-xl hidden group-hover:block z-10 text-center overflow-hidden">
                    <a href="#" class="block px-4 py-2 hover:bg-gray-100 text-gray-700">Edit</a>
                    <a href="#" class="block px-4 py-2 hover:bg-gray-100 text-gray-700 border-t border-b">Share</a>
                    <a href="#" class="block px-4 py-2 hover:bg-red-50 text-red-600">Delete</a>
                </div>
            </div>

            <p class="text-sm text-gray-400 mt-10">Hover over the three dots</p>
        </div>

    </div>

</body>
</html>
